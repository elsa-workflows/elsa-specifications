name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-pack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Elsa.Specifications.sln

      - name: Build
        run: dotnet build Elsa.Specifications.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Elsa.Specifications.sln --configuration Release --no-build --no-restore

      - name: Pack
        run: dotnet pack Elsa.Specifications.sln --configuration Release --no-build --no-restore --output artifacts/packages

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/packages/*.nupkg

  publish-preview:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-test-pack
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Elsa.Specifications.sln

      - name: Pack preview
        run: dotnet pack Elsa.Specifications.sln --configuration Release --no-restore --output artifacts/packages -p:Version=0.0.1-preview.${{ github.run_number }}

      - name: Publish preview to Elsa 4 Feedz
        run: dotnet nuget push "artifacts/packages/*.nupkg" --api-key "$FEEDZ_API_KEY" --source https://nuget.elsa-workflows.io/v3/index.json --skip-duplicate
        env:
          FEEDZ_API_KEY: ${{ secrets.FEEDZ_API_KEY }}
